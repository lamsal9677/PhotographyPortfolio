<dialog id="album" aria-labelledby="albumTitle"><div class="dialoghead"><span id="albumLabel">Selected photographs</span><button class="close" aria-label="Close collection">×</button></div><div class="albumbody"><div class="albumintro"><h2 id="albumTitle"></h2><p id="albumDescription"></p></div><div class="albumcontrols"><button id="albumToggle" aria-expanded="false">View full collection ↓</button><span id="albumCount"></span></div><div class="albumrows" id="albumgrid"></div><div class="albumfoot" id="albumfoot"></div></div></dialog><dialog id="lightbox" aria-label="Photograph viewer"><div class="lighthead"><span id="lightTitle"></span><button class="close" aria-label="Close photograph">×</button></div><div class="lightstage"><img id="lightImage" alt=""><div class="lightcaption" id="lightCaption"></div></div><div class="lightfoot"><span id="lightCount" aria-live="polite"></span><span class="credit">{{NAME}}</span><div><button id="previous" aria-label="Previous photograph">←</button><button id="next" aria-label="Next photograph">→</button></div></div></dialog>
